<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acerca de</title>
    <!-- Opcional: Bootstrap para que se vea ordenado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5 text-center">
        <h2>Acerca de la Desarrolladora</h2>
        <p class="text-muted">Conoce más sobre quién creó este proyecto.</p>
        
        <!-- Botón interactivo -->
        <button type="button" class="btn btn-secondary mt-2" onclick="mostrarDatos()">
            Mostrar Información
        </button>
        
        <!-- Texto que aparecerá al hacer clic -->
        <div id="infoContainer" class="mt-3 fs-5 fw-bold text-success" style="display: none;">
            Valerins Tovar Zúñiga — ADSO 3230489
        </div>
        
        <div class="mt-4">
            <a href="/admin/platos" class="btn btn-primary">Volver al Administrador</a>
        </div>
    </div>

    <!-- Script de JavaScript para la interactividad -->
    <script>
        function mostrarDatos() {
            const contenedor = document.getElementById('infoContainer');
            if (contenedor.style.display === 'none') {
                contenedor.style.display = 'block';
            } else {
                contenedor.style.display = 'none';
            }
        }
    </script>
</body>
</html>
