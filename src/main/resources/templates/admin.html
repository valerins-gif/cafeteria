<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Administrar platos</title>
  <link rel="stylesheet" href="/css/cafeteria.css">
  <!-- Bootstrap CSS (Necesario para que la ventana modal de "Acerca de" funcione correctamente) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <h1>Administrar platos</h1>

  <!-- Barra superior con los tres botones requeridos -->
  <div class="barra">
    <a th:href="@{/admin/platos/nuevo}" class="boton">+ Nuevo plato</a>
    <a th:href="@{/contacto}" class="boton">Contacto</a>
    <button type="button" class="boton" data-bs-toggle="modal" data-bs-target="#modalAcercaDe">Acerca de</button>
    <a th:href="@{/menu}">Ver el menú público</a>
  </div>

  <table>
    <thead>
      <tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${platos}">
        <td th:text="${p.nombre}">Plato</td>
        <td th:text="${p.tipo}">tipo</td>
        <td>$ <span th:text="${#numbers.formatInteger(p.precio, 1, 'POINT')}">0</span></td>
        <td class="acciones">
          <a th:href="@{/admin/platos/{id}/editar(id=${p.id})}" class="boton secundario">Editar</a>
          <form th:action="@{/admin/platos/{id}/eliminar(id=${p.id})}" method="post"
                onsubmit="return confirm('¿Eliminar este plato?')">
            <button type="submit" class="boton peligro">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="vacio" th:if="${#lists.isEmpty(platos)}">Todavía no hay platos.</div>

  <!-- Ventana Modal de "Acerca de" -->
  <div class="modal fade" id="modalAcercaDe" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">Información del Sistema</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center py-4 text-dark">
          <h4 class="fw-bold text-primary">Valerins Tovar Zúñiga</h4>
          <p class="text-muted mb-1">Programa: Análisis y Desarrollo de Software (ADSO)</p>
          <p class="text-muted mb-1">Ficha: **3230489**</p>
          <hr>
          <p class="small text-secondary mb-0">Fecha: <span id="fechaActual"></span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts para la fecha automática y el funcionamiento del modal -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-ES', opciones);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
