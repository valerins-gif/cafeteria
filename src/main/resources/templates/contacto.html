<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">Formulario de Contacto</h2>
            <form action="#" th:action="@{/contacto}" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Tu Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Enviar Mensaje</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/admin/platos" class="btn btn-secondary btn-sm">Volver al Administrador</a>
            </div>
        </div>
    </div>
</body>
</html>
